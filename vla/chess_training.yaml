# Chess VLA Training Configuration
# Default settings for LoRA finetuning pi0.5 on chess robot episodes
#
# Usage:
#   python vla/vla_finetune.py --config vla/chess_training.yaml

# Dataset
dataset_path: "data/episodes"
val_split: 0.1
num_workers: 4

# Training
batch_size: 4
gradient_accumulation_steps: 4  # Effective batch size = 16
learning_rate: 1.0e-5
weight_decay: 0.01
num_epochs: 100
warmup_steps: 100
max_grad_norm: 1.0

# Model
base_model: "lerobot/pi05_base"
freeze_vision_encoder: true   # LoRA-style: freeze vision
freeze_language_encoder: true  # Freeze PaliGemma

# Checkpoints
checkpoint_dir: "checkpoints/chess_pi0"
save_every_n_epochs: 10
save_best: true

# Logging
wandb_project: "chessbot-vla"
use_wandb: false  # Set to true to enable W&B logging
log_every_n_steps: 10

# Hardware
device: "cuda"
mixed_precision: true
compile_model: false

# Loss weights
action_loss_weight: 1.0
auxiliary_loss_weight: 0.1

# Data augmentation (chess-specific)
augment_color: true    # Random color jitter for lighting variation
augment_spatial: false  # Disabled: board position matters
augment_temporal: false  # Disabled: action timing matters
